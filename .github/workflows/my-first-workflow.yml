name: Build and deploy bitburner-src

on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [bitburner-src-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tetonorsolver repo
        uses: actions/checkout@v4

      - name: Checkout bitburner-src
        uses: actions/checkout@v4
        with:
          repository: branchtheory/bitburner-src   # change to bitburner-official/bitburner-src if that's what you actually build from
          ref: docs-content                                 # or whatever branch your deployed site builds from
          path: bitburner-src-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24                          # matches package.json "engines".node
          cache: npm
          cache-dependency-path: bitburner-src-source/package-lock.json

      - name: Install dependencies
        working-directory: bitburner-src-source
        run: npm ci

      - name: Build
        working-directory: bitburner-src-source
        run: npm run build

      - name: Copy build output
        run: |
          rm -rf bitburner-src
          mkdir -p bitburner-src
          cp -r bitburner-src-source/dist/* bitburner-src/    # confirm "dist" is the actual output dir

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bitburner-src
          git diff --staged --quiet || (git commit -m "Update bitburner-src build" && git push)
